        directory_mode: '0755'

    - name: Create case22 webroot
      ansible.builtin.file:
        path: /var/www/case22
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Copy case22 folder to webroot
      ansible.builtin.copy:
        src: files/case22/
        dest: /var/www/case22/
        owner: www-data
        group: www-data
        mode: '0644'
        directory_mode: '0755'

    # ─── Fileserver vhost: serves case01/module6/case22 for       ─
    # ─── direct IP access (192.168.10.10), matched by exact IP so ─
    # ─── it doesn't compete with the name-based vhosts above.     ─
    - name: Deploy fileserver Apache vhost (case01/module6/case22)
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/000-fileserver.conf
        mode: '0644'
        content: |
          <VirtualHost 192.168.10.10:80>
              ServerName www.fileserver.com
              ServerAlias fileserver.com

              DocumentRoot /var/www/html
              <Directory /var/www/html>
                  Options -Indexes
                  Require all denied
              </Directory>

              Alias /case01 /var/www/case01
              <Directory /var/www/case01>
                  Options +Indexes +FollowSymLinks
                  AllowOverride None
                  Require all granted
              </Directory>

              Alias /module6 /var/www/module6
              <Directory /var/www/module6>
                  Options +Indexes +FollowSymLinks
                  AllowOverride None
                  Require all granted
              </Directory>

              Alias /case22 /var/www/case22
              <Directory /var/www/case22>
                  Options +Indexes +FollowSymLinks
                  AllowOverride None
                  Require all granted
              </Directory>

              ErrorLog  ${APACHE_LOG_DIR}/fileserver_error.log
              CustomLog ${APACHE_LOG_DIR}/fileserver_access.log combined
          </VirtualHost>

    - name: Enable fileserver vhost
      ansible.builtin.command:
        cmd: a2ensite 000-fileserver.conf
        creates: /etc/apache2/sites-enabled/000-fileserver.conf

    # ─── Disable default Apache vhost ───────────────────────────
    - name: Disable default Apache vhost
      ansible.builtin.command:
        cmd: a2dissite 000-default.conf
        removes: /etc/apache2/sites-enabled/000-default.conf

    # ─── Test Apache config before reloading ────────────────────
    - name: Test Apache configuration syntax
      ansible.builtin.command:
        cmd: apache2ctl configtest
      register: apache_configtest
      changed_when: false
      failed_when: "'Syntax OK' not in apache_configtest.stderr"

    # ─── Reload Apache to apply all vhosts ──────────────────────
    - name: Reload Apache2
      ansible.builtin.systemd:
        name: apache2
        state: reloaded


