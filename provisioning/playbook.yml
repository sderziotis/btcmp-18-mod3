# ─────────────────────────────────────────────
#  MACHINE 1 - inv1
# ─────────────────────────────────────────────
- name: init machine inv1
  hosts:
    - inv1
  become: true

  tasks:

  # ─── Disable unattended-upgrades─────────────────────────────

    - name: Disable unattended-upgrades during provisioning
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
      failed_when: false

    - name: Kill leftover apt/dpkg processes
      ansible.builtin.shell: |
        pkill -9 apt || true
        pkill -9 dpkg || true
      changed_when: false
      failed_when: false

    - name: Wait for apt lock to be released
      ansible.builtin.shell: >
        while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock \
        /var/cache/apt/archives/lock /var/lib/dpkg/lock >/dev/null 2>&1; do
          sleep 3
        done
      changed_when: false
      failed_when: false



    # apt packages
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - pipx
          - nodejs
          - npm
          - git
          - wget
          - curl
          - jq
          - unzip
          - zip
          - build-essential
          - firefox
          - chromium
          - libimage-exiftool-perl
          - ffmpeg
          - imagemagick
          - dirb
        state: present
        update_cache: 'yes'


    # ─── Sherlock ───────────────────────────────────────────────
    - name: Install Sherlock via pip
      ansible.builtin.pip:
        name: sherlock-project
        executable: pip3
        extra_args: --break-system-packages

    # ─── Sherlock custom_sites.json ─────────────────────────────
    - name: Deploy custom_sites.json for Sherlock
      ansible.builtin.copy:
        dest: /usr/local/lib/python3.12/dist-packages/sherlock_project/resources/custom_sites.json
        mode: '0644'
        content: |
          {
            "Famebook": {
              "errorType": "status_code",
              "url": "http://famebook.com/profile/{}",
              "urlMain": "http://famebook.com",
              "username_claimed": "dmitri.orlov",
              "username_unclaimed": "xnobodyhasthisname999x"
            },
            "BlueFeather": {
              "errorType": "status_code",
              "url": "http://bluefeather.com/author/{}",
              "urlMain": "http://bluefeather.com",
              "username_claimed": "johny.skinny",
              "username_unclaimed": "xnobodyhasthisname999x"
            },
            "SilverCompany": {
              "errorType": "status_code",
              "url": "http://silvercompany.com/team/{}",
              "urlMain": "http://silvercompany.com",
              "username_claimed": "johny.skinny",
              "username_unclaimed": "xnobodyhasthisname999x"
            },
            "PostIt": {
              "errorType": "status_code",
              "url": "http://postit.com/profile/{}",
              "urlMain": "http://postit.com",
              "username_claimed": "johny.skinny",
              "username_unclaimed": "xnobodyhasthisname999x"
            },
            "MyBlogSpot": {
              "errorType": "status_code",
              "url": "http://myblogspot.com/author/{}",
              "urlMain": "http://myblogspot.com",
              "username_claimed": "nikos.andreou",
              "username_unclaimed": "xnobodyhasthisname999x"
            }
          }

    # ─── Bashrc alias for Sherlock ───────────────────────────────
    - name: Add Sherlock alias to user .bashrc
      ansible.builtin.blockinfile:
        path: /home/user/.bashrc
        marker: "# {mark} KYPO SHERLOCK ALIAS"
        block: |
          alias sherlock='sherlock --json /usr/local/lib/python3.12/dist-packages/sherlock_project/resources/custom_sites.json'
        create: false
 
    - name: Source .bashrc for user
      ansible.builtin.shell: |
        echo "source /home/user/.bashrc" >> /home/user/.bash_profile
      args:
        executable: /bin/bash
      changed_when: false

    # ─── /etc/hosts entries for simulated domains (inv1) ────────
    - name: Add simulated domain entries to /etc/hosts on inv1
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} KYPO OSINT LAB DOMAINS"
        block: |
          192.168.10.10  www.silvercompany.com silvercompany.com
          192.168.10.10  www.bluefeather.com bluefeather.com
          192.168.10.10  www.famebook.com famebook.com
          192.168.10.10  www.postit.com postit.com
          192.168.10.10  www.myblogspot.com myblogspot.com
          192.168.10.10  www.fileserver.com fileserver.com

  # ─── MOD2: /etc/hosts entries for mod2 domains (inv1) ───────────
    - name: Add mod2 domain entries to /etc/hosts on inv1
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} KYPO OSINT MOD2 DOMAINS"
        block: |
          192.168.10.10  www.northgate-uni.edu northgate-uni.edu
          192.168.10.10  www.searchly.com searchly.com
          192.168.10.10  www.archivly.com archivly.com

  # ─── Role ─────────────────────────────────────────────────────
  roles:
    - role: user-access
      user_access_username: user
      user_access_password: 'Password123'
      user_access_sudo: true


# ─────────────────────────────────────────────
#  MACHINE 2 - lab1 (now also hosts everything that was on fs1)
# ─────────────────────────────────────────────
- name: init machine lab1
  hosts:
    - lab1
  become: true

  tasks:
    # ─── Disable unattended-upgrades─────────────────────────────

    - name: Disable unattended-upgrades during provisioning
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
      failed_when: false

    - name: Kill leftover apt/dpkg processes
      ansible.builtin.shell: |
        pkill -9 apt || true
        pkill -9 dpkg || true
      changed_when: false
      failed_when: false

    - name: Wait for apt lock to be released
      ansible.builtin.shell: >
        while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock \
        /var/cache/apt/archives/lock /var/lib/dpkg/lock >/dev/null 2>&1; do
          sleep 3
        done
      changed_when: false
      failed_when: false


    # ─── APT packages ───────────────────────────────────────────
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - pipx
          - nodejs
          - npm
          - git
          - wget
          - curl
          - jq
          - unzip
          - zip
          - rsync
          - build-essential
          - apache2
          - php
          - libapache2-mod-php
          - php-fpm
          - php-cli
          - openssh-server
          - cron
          - sqlite3
          - openssl
          - net-tools
          - dnsutils
          - python3-flask
          - python3-gunicorn
        state: present
        update_cache: 'yes'

    # ─── Enable Apache modules FIRST (before any vhost is enabled) ─
    - name: Enable Apache headers module
      ansible.builtin.command:
        cmd: a2enmod headers
        creates: /etc/apache2/mods-enabled/headers.load

    - name: Enable Apache proxy modules
      ansible.builtin.command:
        cmd: a2enmod proxy proxy_http
        creates: /etc/apache2/mods-enabled/proxy.load

    # ─── Apache vhost config: silvercompany.com ─────────────────
    - name: Create silvercompany webroot
      ansible.builtin.file:
        path: /var/www/silvercompany
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Deploy silvercompany index.html
      ansible.builtin.copy:
        src: files/silvercompany/index.html
        dest: /var/www/silvercompany/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Deploy silvercompany robots.txt
      ansible.builtin.copy:
        src: files/silvercompany/robots.txt
        dest: /var/www/silvercompany/robots.txt
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Deploy silvercompany Apache vhost
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/silvercompany.conf
        mode: '0644'
        content: |
          <VirtualHost *:80>
              ServerName www.silvercompany.com
              ServerAlias silvercompany.com
              DocumentRoot /var/www/silvercompany
              DirectoryIndex index.html

              <Directory /var/www/silvercompany>
                  Options -Indexes +FollowSymLinks
                  AllowOverride None
                  Require all granted
              </Directory>

              Header always set X-Powered-By "PHP/8.3.1"
              Header always set X-Generator "WordPress/6.4.2"

              ErrorLog ${APACHE_LOG_DIR}/silvercompany_error.log
              CustomLog ${APACHE_LOG_DIR}/silvercompany_access.log combined
          </VirtualHost>

    - name: Enable silvercompany vhost
      ansible.builtin.command:
        cmd: a2ensite silvercompany.conf
        creates: /etc/apache2/sites-enabled/silvercompany.conf

