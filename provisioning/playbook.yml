    - name: Deploy northgate Apache vhost
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/northgate.conf
        mode: '0644'
        content: |
          <VirtualHost *:80>
              ServerName www.northgate-uni.edu
              ServerAlias northgate-uni.edu
              DocumentRoot /var/www/northgate
              DirectoryIndex index.html

              <Directory /var/www/northgate>
                  Options -Indexes +FollowSymLinks
                  AllowOverride None
                  Require all granted
              </Directory>

              Header always set X-Powered-By "Django/4.2"
              Header always set X-Backend-Server "gunicorn/21.2.0"

              ErrorLog  ${APACHE_LOG_DIR}/northgate_error.log
              CustomLog ${APACHE_LOG_DIR}/northgate_access.log combined
          </VirtualHost>

    - name: Enable northgate vhost
      ansible.builtin.command:
        cmd: a2ensite northgate.conf
        creates: /etc/apache2/sites-enabled/northgate.conf

    # ─── MOD2: Searchly — Simulated Search Engine (port 5010) ───
    - name: Create Searchly app directory
      ansible.builtin.file:
        path: /opt/searchly
        state: directory
        mode: '0755'

    - name: Deploy Searchly Flask application
      ansible.builtin.copy:
        src: files/searchly/app.py
        dest: /opt/searchly/app.py
        mode: '0644'

    - name: Create Searchly systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/searchly.service
        mode: '0644'
        content: |
          [Unit]
          Description=Searchly Simulated Search Engine (Flask)
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 /opt/searchly/app.py
          WorkingDirectory=/opt/searchly
          Restart=always
          User=www-data
          Group=www-data
          Environment=FLASK_ENV=production

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Searchly service
      ansible.builtin.systemd:
        name: searchly
        daemon_reload: true
        enabled: true
        state: started

    - name: Deploy Searchly Apache reverse-proxy vhost
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/searchly.conf
        mode: '0644'
        content: |
          <VirtualHost *:80>
              ServerName www.searchly.com
              ServerAlias searchly.com

              ProxyPreserveHost On
              ProxyPass        / http://127.0.0.1:5010/
              ProxyPassReverse / http://127.0.0.1:5010/

              ErrorLog  ${APACHE_LOG_DIR}/searchly_error.log
              CustomLog ${APACHE_LOG_DIR}/searchly_access.log combined
          </VirtualHost>

    - name: Enable searchly vhost
      ansible.builtin.command:
        cmd: a2ensite searchly.conf
        creates: /etc/apache2/sites-enabled/searchly.conf

