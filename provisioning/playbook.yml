    # ─── Famebook — Flask social media app ──────────────────────
    - name: Create Famebook app directory
      ansible.builtin.file:
        path: /opt/famebook
        state: directory
        mode: '0755'
 
    - name: Deploy Famebook Flask application
      ansible.builtin.copy:
        src: files/famebook/app.py
        dest: /opt/famebook/app.py
        mode: '0644'
 
    - name: Create Famebook static directory
      ansible.builtin.file:
        path: /opt/famebook/static
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
 
    - name: Deploy mountain image to Famebook static (preserve metadata)
      ansible.builtin.copy:
        src: files/famebook/static/mountain.png
        dest: /opt/famebook/static/johnyskinny_mountains.jpg
        owner: www-data
        group: www-data
        mode: '0644'
 
    # ─── PostIt — Flask social media app ────────────────────────
    - name: Create PostIt app directory
      ansible.builtin.file:
        path: /opt/postit
        state: directory
        mode: '0755'
 
    - name: Deploy PostIt Flask application
      ansible.builtin.copy:
        src: files/postit/app.py
        dest: /opt/postit/app.py
        mode: '0644'
 
    - name: Create PostIt static directory
      ansible.builtin.file:
        path: /opt/postit/static
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
 
    - name: Deploy beach image to PostIt static (preserve metadata)
      ansible.builtin.copy:
        src: files/postit/static/beach.png
        dest: /opt/postit/static/johnyskinny_beach.jpg
        owner: www-data
        group: www-data
        mode: '0644'
 
    - name: Create PostIt systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/postit.service
        mode: '0644'
        content: |
          [Unit]
          Description=PostIt Social Media Simulation (Flask)
          After=network.target
 
          [Service]
          ExecStart=/usr/bin/python3 /opt/postit/app.py
          WorkingDirectory=/opt/postit
          Restart=always
          User=www-data
          Group=www-data
          Environment=FLASK_ENV=production
 
          [Install]
          WantedBy=multi-user.target
 
    - name: Enable and start PostIt service
      ansible.builtin.systemd:
        name: postit
        daemon_reload: true
        enabled: true
        state: started
 
    - name: Deploy PostIt Apache reverse-proxy vhost
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/postit.conf
        mode: '0644'
        content: |
          <VirtualHost *:80>
              ServerName www.postit.com
              ServerAlias postit.com
 
              ProxyPreserveHost On
              ProxyPass        / http://127.0.0.1:5001/
              ProxyPassReverse / http://127.0.0.1:5001/
 
              ErrorLog  ${APACHE_LOG_DIR}/postit_error.log
              CustomLog ${APACHE_LOG_DIR}/postit_access.log combined
          </VirtualHost>
 
    - name: Enable postit vhost
      ansible.builtin.command:
        cmd: a2ensite postit.conf
        creates: /etc/apache2/sites-enabled/postit.conf
 
    - name: Create Famebook systemd service
      ansible.builtin.copy:
