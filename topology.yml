# Main topology
name: btcmp-18-main-v8
hosts:
  - name: lab1
    flavor: c3_r3_d20
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
      mgmt_protocol: ssh
    hidden: true
routers:
  - name: inv1
    flavor: c2_r4_d40
    base_box:
      image: xubuntu-noble-x86_64
      mgmt_user: ubuntu
      mgmt_protocol: ssh
    hidden: false
networks:
  - name: network-3
    cidr: 192.168.10.0/24
    accessible_by_user: true
    hidden: true
wan:
  name: network-1
  cidr: 10.10.10.0/24
net_mappings:
  - host: lab1
    network: network-3
    ip: 192.168.10.10
router_mappings:
  - router: inv1
    network: network-3
    ip: 192.168.10.1
groups: []


